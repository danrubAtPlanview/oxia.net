name: Feature request
description: Suggest an improvement, a missing feature, or a newer upstream change to port.
title: "[feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion. Some context first:

        - The goal of this project is a **faithful** port of the Oxia Go client: same behaviour, same wire protocol, same tests. New *client behaviour* is normally added upstream first and then ported; a feature that does not exist in the Go client is a deliberate extension and needs a good reason (see `DESIGN.md`).
        - API and performance improvements that keep the Go behaviour are very welcome.

  - type: checkboxes
    id: preflight
    attributes:
      label: Before you start
      options:
        - label: I searched the existing issues and discussions.
          required: true

  - type: dropdown
    id: kind
    attributes:
      label: What kind of request is this?
      options:
        - Port a newer upstream change (sync with the Go client)
        - .NET API ergonomics
        - Performance or allocation improvement
        - Documentation
        - Packaging, CI or tooling
        - A feature the Go client does not have (extension)
        - Other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem or motivation
      description: What are you trying to do, and what gets in the way? If you ask for a newer upstream change, link the upstream commit or pull request.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like to see? Sketch the API (C# signatures) if you have one in mind.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Workarounds you use today, or other designs you thought about.

  - type: checkboxes
    id: contribute
    attributes:
      label: Contribution
      options:
        - label: I would be willing to open a pull request for this (see `CONTRIBUTING.md`).
