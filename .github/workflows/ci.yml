name: CI

# Build and test on every push to the default branch and on every pull request.
#
#   build-test           Release build with warnings as errors + the unit-test suite, on Linux and Windows.
#   integration          The ported Go integration tests against a real Oxia server (reusable Docker fixture, Linux runner).
#   integration-cluster  The coordinator-based tests plus the TLS/OIDC security tests (OXIA_TEST_CLUSTER=1).
#                        Allowed to fail until the Linux validation of the cluster profile is complete (docs/linux-validation.md).
#
# There is deliberately no format job yet: `dotnet format whitespace` still reports hand-aligned code in a few files (the wire codecs and some
# tests). Add one once those files are formatted.
#
# The AWS benchmark is NOT run here: it is operator-run (bench/aws) and needs AWS credentials, which this repository never stores.

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

concurrency:
  # A new push to a pull request (or branch) cancels the run it supersedes.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_GENERATE_ASPNET_CERTIFICATE: false
  # Server image of the integration fixture. The nightly image moves; set the repository variable OXIA_TEST_IMAGE to a digest
  # (oxia/oxia@sha256:...) built from the pinned upstream commit to make the integration runs reproducible.
  OXIA_TEST_IMAGE: ${{ vars.OXIA_TEST_IMAGE || 'oxia/oxia:nightly-beta' }}

jobs:
  build-test:
    name: Build & unit tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Packages.props', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore Oxia.slnx

      - name: Build (Release, warnings are errors)
        run: dotnet build Oxia.slnx -c Release --no-restore -warnaserror

      - name: Unit tests
        # The allocation-budget tests skip themselves on runners with fewer than 14 cores; run them locally (CONTRIBUTING.md).
        run: >
          dotnet test tests/Oxia.Client.Tests -c Release --no-build
          --logger "trx;LogFileName=unit-tests-${{ runner.os }}.trx"
          --logger "console;verbosity=normal"
          --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: unit-test-results-${{ runner.os }}
          path: TestResults/*.trx
          if-no-files-found: warn
          retention-days: 14

  integration:
    name: Integration tests (Docker server)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Packages.props', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Pull the Oxia server image
        run: docker pull "$OXIA_TEST_IMAGE"

      - name: Build
        run: dotnet build tests/Oxia.Client.IntegrationTests -c Release -warnaserror

      - name: Integration tests (standalone server profile)
        # The TLS/OIDC tests need the coordinator cluster container; they run in the integration-cluster job.
        # OXIA_TEST_IMAGE, OXIA_TEST_* : see tests/Oxia.Client.IntegrationTests/README.md
        run: >
          dotnet test tests/Oxia.Client.IntegrationTests -c Release --no-build
          --filter "FullyQualifiedName!~Oxia.Client.IntegrationTests.Security"
          --logger "trx;LogFileName=integration-tests.trx"
          --logger "console;verbosity=normal"
          --results-directory TestResults
        env:
          OXIA_TEST_CLEANUP: "1"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: integration-test-results
          path: TestResults/*.trx
          if-no-files-found: warn
          retention-days: 14

  integration-cluster:
    name: Integration tests (cluster, TLS, OIDC)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Allowed to fail until the Linux validation of the cluster profile is complete (see docs/linux-validation.md).
    # Remove this line to make the job a required check.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Packages.props', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Pull the Oxia server image
        run: docker pull "$OXIA_TEST_IMAGE"

      - name: Build
        run: dotnet build tests/Oxia.Client.IntegrationTests -c Release -warnaserror

      - name: Integration tests (cluster profile + security)
        run: >
          dotnet test tests/Oxia.Client.IntegrationTests -c Release --no-build
          --logger "trx;LogFileName=integration-cluster-tests.trx"
          --logger "console;verbosity=normal"
          --results-directory TestResults
        env:
          OXIA_TEST_CLUSTER: "1"
          OXIA_TEST_CLEANUP: "1"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: integration-cluster-test-results
          path: TestResults/*.trx
          if-no-files-found: warn
          retention-days: 14
